# Local development environment: database, broker, API, worker and scheduler.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threatfeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threatfeed}
      POSTGRES_DB: ${POSTGRES_DB:-threatfeed}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # INTERVIEW: a named volume survives `docker compose down`; only `down -v` wipes it.
      # postgres:18 moved its data VOLUME from /var/lib/postgresql/data to /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # INTERVIEW: "container started" is not "ready to accept connections"; pg_isready checks the latter.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: threatfeed:local
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    image: threatfeed:local
    restart: unless-stopped
    command: celery -A threatfeed.celery_app worker --loglevel=INFO --concurrency=2
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.cache:/app/.cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    image: threatfeed:local
    restart: unless-stopped
    command: celery -A threatfeed.celery_app beat --loglevel=INFO
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.cache:/app/.cache
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
