[project]
name = "threatfeed"
version = "0.1.0"
description = "Threat intelligence pipeline that ingests public IoC feeds, normalizes and deduplicates them into PostgreSQL, and answers 'is this indicator known malicious?' over a REST API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy>=2.0.52",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "alembic>=1.19.2",
]
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (defaults) · I: import sorting · UP: modernize syntax for py312
# B: bugbear (likely bugs) · SIM: simplify (needless complexity)
select = ["E", "F", "I", "UP", "B", "SIM"]

# Alembic reads its configuration from here (no alembic.ini). The database URL is NOT stored
# in any file: env.py takes it from threatfeed.config.Settings, like the app does.
[tool.alembic]
script_location = "%(here)s/src/threatfeed/db/migrations"
# Timestamped file names, so migrations sort chronologically like Rails' db/migrate/.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"

# Generated migration files come out lint-clean and formatted.
[[tool.alembic.post_write_hooks]]
name = "ruff-fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff-format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"